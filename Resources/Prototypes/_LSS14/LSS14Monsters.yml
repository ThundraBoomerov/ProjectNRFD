      path: /Audio/_LSS/Monsters/dog_scream.ogg
      params:
        volume: 0

- type: species
  id: LSS14DogSpecies
  #roundStart: true - Возможно потом (Разрешение играть за него)
  prototype: LSS14Dog
  allowedEmotes:
    - Growl


- type: entity
  name: ???
  description: "Огромный монстр, похожий на собаку. Его пасть огромна, а когти остры. Он выглядит очень агрессивно."
  parent: MobXenoRunner
  id: LSS14Dog
  suffix: LSS14 Собака
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/Xenos/rouny.rsi
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
    offset: 0,0.6
  - type: MeleeWeapon
    damage:
     groups:
       Brute: 35
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatRouny
      amount: 3
  - type: Vocal
    sounds:
      male: LSS14DogSounds
      female: LSS14DogSounds
      unsexed: LSS14DogSounds
    wilhelm: false
  - type: Emoting
  - type: MovementSpeedModifier
    baseSprintSpeed: 6.0



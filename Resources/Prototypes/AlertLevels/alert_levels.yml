- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/Misc/bluealert.ogg
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/Misc/notice1.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: /Audio/Misc/redalert.ogg
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound:
        path: /Audio/Corvax/Misc/siren.ogg # Corvax: Return of the old siren sound
        params:
          volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound:
        path: /Audio/Misc/delta.ogg
        params:
          volume: -6 # Corvax: Reduce sound volume
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound:
        path: /Audio/Misc/epsilon.ogg
        params:
          volume: -2
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    defcon5: ###############
      announcement: "Внимание! Текущий код DEFCON 5 — обычная военная готовность, соответствующая мирному времени."
      color: Blue
      emergencyLightColor: LawnGreen
      shuttleTime: 600
      selectable: false
      sound:
        path: /Audio/_DEFCON/Alarms/defconstage.ogg
        params:
          volume: -2
      disableSelection: false
    defcon4: ###############
      announcement: "Внимание! Текущий код DEFCON 4 — обычная боевая готовность, задействованы разведывательные службы."
      color: Green
      emergencyLightColor: Orange
      shuttleTime: 600
      selectable: false
      sound:
        path: /Audio/_DEFCON/Alarms/defconstage.ogg
        params:
          volume: -2
      disableSelection: false
    defcon3: ###############
      announcement: "Внимание! Текущий код DEFCON 3 — уровень повышенной боевой готовности. Все военные подразделения сменяют свои радиопозывные согласно секретным документам."
      color: Yellow
      emergencyLightColor: Red
      shuttleTime: 600
      selectable: false
      sound:
        path: /Audio/_DEFCON/Alarms/defconstage.ogg
        params:
          volume: -2
      disableSelection: false
      forceEnableEmergencyLights: true
    defcon2: ###############
      announcement: "Внимание! Текущий код DEFCON 2 — этот уровень предшествует максимальной боевой готовности. Опасность эскалации!"
      color: Red
      emergencyLightColor: DarkRed
      shuttleTime: 600
      selectable: false
      sound:
        path: /Audio/_DEFCON/Alarms/defconstage.ogg
        params:
          volume: -2
      disableSelection: false
      forceEnableEmergencyLights: true
    defcon1:
      announcement: "Внимание! Текущий код DEFCON 1 — максимальная боеготовность! Мир находятся в преддверии крупномасштабного военного конфликта с возможным использованием оружия массового поражения!" 
      selectable: false
      color: White
      sound:
        path: /Audio/_DEFCON/Alarms/defconstage.ogg
        params:
          volume: -2
      disableSelection: false
      emergencyLightColor: DarkRed
      forceEnableEmergencyLights: true
      shuttleTime: 600
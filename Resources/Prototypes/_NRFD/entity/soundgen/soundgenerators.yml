# Base


- type: entity
  parent: MarkerBase
  id: SoundGenBase
  name: SoundGenBase
  abstract: true
  description: Генератор звуков
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _NRFD/soundgen.rsi
        state: icon
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg
      radius: 6

- type: entity
  parent: MarkerBase
  id: SoundGenBaseAmbient
  name: SoundGenBaseAmbient
  abstract: true
  description: Генератор звуков
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _NRFD/soundgen.rsi
        state: icon_ambient
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg
      radius: 6
      loop: true


# Обычные УДАЛЯЮТСЯ САМИ


- type: entity
  parent: SoundGenBase
  id: SoundGenDestruction1
  name: Звукогенератор О
  suffix: Капает вода
  abstract: false
  components:
  - type: TimedDespawn #САМ УДАЛЯЕТСЯ
    lifetime: 61 #В СЕКУНДАХ
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg



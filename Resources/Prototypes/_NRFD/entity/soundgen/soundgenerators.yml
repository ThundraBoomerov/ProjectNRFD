# Base

- type: entity
  parent: MarkerBase
  id: SoundGenBase
  name: SoundGenBase
  abstract: true
  description: Генератор звуков
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _NRFD/soundgen.rsi
        state: icon
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg
      radius: 6
      volume: 3

- type: entity
  parent: MarkerBase
  id: SoundGenBaseAmbient
  name: SoundGenBaseAmbient
  abstract: true
  description: Генератор звуков
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _NRFD/soundgen.rsi
        state: icon_ambient
  - type: AmbientSound
    enabled: true
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg
    volume: 4
    range: 10
    interval: 0


# Обычные УДАЛЯЮТСЯ САМИ ######################################


- type: entity
  parent: SoundGenBase
  id: SoundGenDestruction1
  name: Звукогенератор О
  suffix: Капает вода
  abstract: false
  components:
  - type: TimedDespawn #САМ УДАЛЯЕТСЯ
    lifetime: 61 #В СЕКУНДАХ. НА ОДНУ БОЛЬШЕ, ЧЕМ САМ ЗВУК
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/shaft_water.ogg

- type: entity
  parent: SoundGenBase
  id: SoundGenCompanySpeech
  name: Звукогенератор О
  suffix: Интро речь компании
  abstract: false
  components:
  - type: TimedDespawn
    lifetime: 38
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_NRFD/SoundGen/intro-company-speech.ogg


- type: entity
  id: BoomBox
  parent: BaseItem
  name: Магнитофон
  description: Магнитофон, который может воспроизводить музыку. Имеет несколько треков для выбора и возможность остановить воспроизведение.
  components:
  - type: Sprite
    sprite: _NRFD/boombox.rsi
    state: icon
  - type: Item
    size: Normal
  - type: BoomBox
    tracks:
    - path: /Audio/_NRFD/BoomBox/boombox_music1.ogg
    - path: /Audio/_NRFD/BoomBox/boombox_music2.ogg
    - path: /Audio/_NRFD/BoomBox/boombox_music3.ogg
    - path: /Audio/_NRFD/BoomBox/boombox_music4.ogg
    - path: /Audio/_NRFD/BoomBox/boombox_music5.ogg
    stopSound:
      path: /Audio/_NRFD/BoomBox/boombox_stop.ogg

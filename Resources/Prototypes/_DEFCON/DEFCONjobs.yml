- type: department
  id: DEFCON_bunker
  name: Бункер
  description: Персонал, работающий в бункере.
  color: "#5fc07c"
  roles:
  - EU_Bunker_Head #Глава бункера 
  - EU_Bunker_Negotiator #Переговорщик
  - EU_Bunker_Staff #Универсальный персонал
  - NC_Bunker_Head #NORTH COM
  - NC_Bunker_Negotiator
  - NC_Bunker_Staff
  - AS_Bunker_Head #ASIA
  - AS_Bunker_Negotiator
  - AS_Bunker_Staff
  - US_Bunker_Head #USA
  - US_Bunker_Negotiator
  - US_Bunker_Staff
  editorHidden: true
  weight: 130

########EU BUNKER HEAD########

- type: job
  id: EU_Bunker_Head
  name: Глава Бункера (EU)
  description: Руководит всеми процессами в бункере, следит за соблюдением рабочих норм.
  playTimeTracker: JobEU_Bunker_Head
  weight: 20
  startingGear: EU_Bunker_HeadGear
  icon: "JobIconCaptain" #+"JobIconLawyer"+"JobIconNanotrasen"
  supervisors: job-supervisors-centcom
  canBeAntag: false
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: EU_Bunker_HeadGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitCapFormal
    shoes: ClothingShoesBootsLaceup
    eyes: ClothingEyesGlassesCommand
    gloves: ClothingHandsGlovesCaptain
    id: CaptainPDA
    ears: ClothingHeadsetAltCommand

#jumpsuits:
#ClothingUniformJumpsuitCapFormal
#ClothingUniformJumpsuitLawyerBlack
#ClothingUniformJumpsuitDetective

#shoes
#ClothingShoesBootsLaceup
#ClothingShoesBootsLaceup
#ClothingShoesBootsJack

#eyes
#ClothingEyesGlassesCommand
#ClothingEyesGlassesSunglasses
#ClothingEyesGlassesMercenary

#gloves
#ClothingHandsGlovesCaptain
#ClothingHandsGlovesColorWhite
#ClothingHandsGlovesMercFingerless

#id
#CaptainPDA
#LawyerPDA
#EngineerPDA

#ears
#ClothingHeadsetAltCommand
#ClothingHeadsetCommand
#ClothingHeadsetAltCommand

- type: entity
  id: SpawnPointEU_Bunker_Head
  parent: SpawnPointJobBase
  name: EU_Bunker_Head
  suffix: DEFCON
  components:
  - type: SpawnPoint
    job_id: 
  - type: Sprite
    layers:
      - state: green
      - state: captain

#state №2
#captain
#lawyer
#engineer

